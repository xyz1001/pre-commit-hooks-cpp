- id: check-commit-msg
  name: check commit message
  entry: check-commit-msg
  description: 检查提交内容是否符合规范
  language: python
  stages: [commit-msg]
- id: check-linebreak
  name: check linebreak
  entry: check-linebreak
  description: 检查换行符是否为LF
  language: python
  types: [text]
- id: check-utf8
  name: check utf8
  entry: check-utf8
  description: 检查文件是否为UTF-8编码
  language: python
  types: [text]
- id: check-version
  name: check version
  entry: check-version
  description: 检查版本号是否正确（提交信息与版本文件匹配，版本号递增合法）
  language: python
  stages: [commit-msg, post-commit]
  always_run: true
- id: check-autouic-include-path
  name: check autouic include path
  entry: check-autouic-include-path
  description: 检查 ui_*.h include 是否有对应的 Qt .ui 文件
  language: python
  stages: [pre-commit]
  always_run: true
  pass_filenames: false
- id: conan-version-merge-driver
  name: conan version merge driver
  entry: conan-version-merge-driver
  description: Reapply rebased semantic-version bumps
  language: python
  stages: [manual]
  pass_filenames: true
  require_serial: true
  always_run: true
- id: conan-version-post-rewrite
  name: conan version post rewrite
  entry: conan-version-post-rewrite
  description: Normalize semantic versions after rebase
  language: python
  stages: [post-rewrite]
  pass_filenames: false
  always_run: true
